schema:
  schema_id: synthetic
  name: Synthetic IMK fixture
  version: '1.0'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, ASCII]
engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
translator:
  dictionary: synthetic
  enable_user_dict: false
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
